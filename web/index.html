<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Lot – Showroom Control</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚘</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Hanken+Grotesk:wght@400;600&family=Noto+Naskh+Arabic:wght@400;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#E3E5E1;--panel:#F4F5F2;--ink:#1D2227;--mute:#667078;--paint:#E9B817;--line:#C5C9C3;
--stock:#0E6B6B;--sold:#2B3038;--rent:#DB5A24;--serv:#7A4FA3;--ok:#1E7A3C;--bad:#B3261E;
color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16191D;--panel:#20252B;--ink:#ECEEEA;--mute:#98A1A8;--line:#343B43;--stock:#2FA3A3;--sold:#6B7480;--rent:#F07A45;--serv:#A47FD0;--ok:#4CC27A;--bad:#F2766F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16191D;--panel:#20252B;--ink:#ECEEEA;--mute:#98A1A8;--line:#343B43;--stock:#2FA3A3;--sold:#6B7480;--rent:#F07A45;--serv:#A47FD0;--ok:#4CC27A;--bad:#F2766F;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:15px}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,.num{font-family:'Big Shoulders Display','Arial Narrow',sans-serif;margin:0;letter-spacing:.01em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1.5px solid var(--ink);background:transparent;padding:7px 13px;border-radius:6px;font-weight:600}
button:hover{background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--paint);outline-offset:1px}
button.pri{background:var(--ink);color:var(--bg)}
button.pri:hover{background:var(--paint);color:#1D2227;border-color:var(--paint)}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:end;justify-content:space-between;border-bottom:4px solid var(--ink);padding-bottom:12px}
header h1{font-size:44px;font-weight:800;line-height:.9}
.clock{text-align:right}.clock .num{font-size:40px;font-weight:800;line-height:1}
.clock div:last-child{color:var(--mute)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;margin:16px 0;border:1.5px solid var(--line);border-radius:8px;background:var(--panel)}
.kpi{padding:12px 14px;border-right:1.5px solid var(--line)}.kpi:last-child{border-right:0}
.kpi .num{font-size:32px;font-weight:800;line-height:1}.kpi span{color:var(--mute);font-size:13px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
nav button{border-color:var(--line)}nav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mix{display:flex;height:34px;border-radius:6px;overflow:hidden;margin-bottom:12px;border:1.5px solid var(--ink)}
.mix button{border:0;border-radius:0;color:#fff;padding:0 8px;text-align:left;white-space:nowrap;overflow:hidden;font-size:13px;opacity:.55}
.mix button.on,.mix button:hover{opacity:1}
.mix button:hover{color:#fff}
.lot{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;background:repeating-linear-gradient(0deg,transparent 0 0),var(--panel);padding:12px;border-radius:8px;border:1.5px solid var(--line)}
.bay{border:2px dashed var(--paint);border-top-style:solid;border-radius:4px;padding:10px 8px 8px;background:transparent;text-align:left;display:block;width:100%;color:var(--ink)}
.bay:hover{background:color-mix(in srgb,var(--paint) 16%,transparent);color:var(--ink)}
.car{height:62px;border-radius:18px 18px 12px 12px;background:var(--c);position:relative;margin:0 auto 8px;width:60%}
.car:before{content:"";position:absolute;left:12%;right:12%;top:16%;height:22%;background:rgba(255,255,255,.35);border-radius:6px}
.car:after{content:"";position:absolute;left:12%;right:12%;bottom:14%;height:14%;background:rgba(0,0,0,.28);border-radius:5px}
.bay b{display:block;font-size:14px}.bay small{color:var(--mute);display:block}
.tag{display:inline-block;margin-top:5px;font-size:12px;font-weight:600;color:var(--c)}
.add{border:2px dashed var(--line);display:grid;place-items:center;min-height:150px;color:var(--mute)}
table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:8px;overflow:hidden}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:600;font-size:13px}
.scroll{overflow-x:auto;border:1.5px solid var(--line);border-radius:8px}
.pill{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1.5px solid currentColor}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;justify-content:flex-end;z-index:20}
.drawer{background:var(--panel);width:min(400px,100%);height:100%;overflow:auto;padding:20px 18px;border-left:4px solid var(--paint)}
.drawer h2{font-size:30px;margin-bottom:2px}
label{display:block;margin:10px 0 3px;font-size:13px;color:var(--mute)}
input,select{width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tl{list-style:none;margin:0;padding:0;background:var(--panel);border:1.5px solid var(--line);border-radius:8px}
.tl li{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.tl li small{color:var(--mute);display:block}
.tools{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:30}
button.kpi{border:0;border-right:1.5px solid var(--line);border-radius:0;text-align:left;background:none;color:var(--ink);font-weight:400}
button.kpi:hover{background:color-mix(in srgb,var(--paint) 22%,transparent);color:var(--ink)}
.srch{display:flex;gap:6px}.srch input{width:210px}.srch select{width:auto}
.alert{display:block;width:100%;text-align:left;border:1.5px solid var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent);padding:10px 14px;border-radius:8px;margin-bottom:12px;font-weight:600}
button.alert:hover{background:var(--bad);color:var(--bg)}
.chart{background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:12px}
.chart .tools{margin:0 0 4px}.chart svg{width:100%;height:84px;display:block}.day{cursor:pointer}.day:hover rect:first-child{fill:color-mix(in srgb,var(--paint) 35%,transparent)}
.dock{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.zone{border:2px dashed var(--line);border-radius:8px;padding:16px;text-align:center;color:var(--mute);font-weight:600}
.zone.hot{border-color:var(--paint);color:var(--ink);background:color-mix(in srgb,var(--paint) 22%,transparent)}
.sync{margin-left:auto;color:var(--mute);font-size:13px;align-self:center}
.chip.on{background:var(--ink);color:var(--bg)}.bay[draggable=true]{cursor:grab}
.ai{display:grid;gap:12px}.card{background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:14px 16px}
.card h2{font-size:26px;margin-bottom:8px}.srch2{display:flex;gap:8px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border-color:var(--line);font-weight:400;padding:4px 10px;font-size:13px}
.out{white-space:pre-wrap;margin-top:10px;line-height:1.55;max-width:75ch}.out:empty{display:none}
.al{list-style:none;margin:0;padding:0}.al li{padding:7px 0;border-bottom:1px solid var(--line)}.al li:before{content:"\25CF  "}.al .bad:before{color:var(--bad)}.al .warn:before{color:var(--paint)}
.fc{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.fc>div{border:1.5px solid var(--line);border-radius:8px;padding:10px}.fc .num{font-size:28px;font-weight:800}
button:disabled{opacity:.5;cursor:default}
.btnlink{display:inline-block;border:1.5px solid var(--ink);padding:7px 13px;border-radius:6px;font-weight:600;text-decoration:none;color:var(--ink)}.btnlink:hover{background:var(--ink);color:var(--bg)}
.nop{height:62px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));color:#fff;line-height:1.2}.nop b{font:800 17px 'Big Shoulders Display','Arial Narrow',sans-serif;letter-spacing:.02em}.nop span{font-size:11px;opacity:.85}.nop.big{height:150px}.nop.big b{font-size:36px}.nop.big span{font-size:13px}
.phg figure .thumb{position:static;padding:0;background:none;border:2px solid transparent;border-radius:6px}.phg figure .thumb.main{border-color:var(--paint)}.phg figure .thumb:hover{background:none}.phg figure .thumb img{width:84px;height:64px;object-fit:cover;display:block;border-radius:4px}
.carart{position:relative;height:62px;margin-bottom:8px}.carart svg{width:100%;height:62px;display:block;transition:transform .25s}.bay:hover .carart svg{transform:translateX(4px)}
.hero{background:color-mix(in srgb,var(--line) 45%,var(--panel));border-radius:10px;padding:10px;margin-bottom:10px}.hero svg,.hero img{width:100%;max-height:150px;object-fit:cover;display:block;border-radius:8px}
.sw{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.swb{width:24px;height:24px;padding:0;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1.5px var(--line)}
.phg{display:flex;gap:6px;flex-wrap:wrap}.phg figure{margin:0;position:relative}.phg img{width:84px;height:64px;object-fit:cover;border-radius:6px;display:block}.phg figure button{position:absolute;right:2px;top:2px;padding:0 6px;font-size:11px;background:var(--panel);border-color:var(--line)}
.phwrap{position:relative;height:62px;margin-bottom:8px}.ph{width:100%;height:62px;object-fit:cover;border-radius:8px;display:block}
.rings{display:flex;flex-wrap:wrap;gap:16px 30px;margin-top:6px}.rings>div{display:flex;flex-direction:column;gap:6px;align-items:flex-start}.rg{display:flex;align-items:center;gap:12px}.rg svg{width:86px;height:86px;flex:none}
.tg.anim .rgp{animation:rgrow 1.1s ease-out}@keyframes rgrow{from{stroke-dasharray:0 300}}
.pm{display:flex;gap:8px;margin-top:10px}.pm>div{flex:1;display:flex;flex-direction:column;align-items:center}.pm .up{height:92px;display:flex;align-items:flex-end;width:100%}
.pm .dn{height:92px;width:100%;display:flex;align-items:flex-start;border-top:1.5px solid var(--ink)}.pm i{display:block;width:100%;border-radius:4px}.pm .up i{background:var(--ok)}.pm .dn i{background:var(--bad)}.pm b{font-size:12px;margin-top:4px}.pm small{color:var(--mute);font-size:11px}
.att{min-width:max-content}.att th,.att td{padding:3px 2px;text-align:center;border-bottom:1px solid var(--line)}.att td:first-child,.att th:first-child{text-align:left;padding-left:10px;white-space:nowrap;position:sticky;left:0;background:var(--panel)}
.ac{width:26px;height:26px;padding:0;border:1.5px dashed var(--line);border-radius:6px;font-size:12px;font-weight:700}.ac:hover{filter:brightness(.92);background:var(--line);color:var(--ink)}
.ac.ok{background:var(--ok);border:1.5px solid var(--ok);color:#fff}.ac.bad{background:var(--bad);border:1.5px solid var(--bad);color:#fff}.ac.warn{background:var(--paint);border:1.5px solid var(--paint);color:#1D2227}.ac.half{background:var(--rent);border:1.5px solid var(--rent);color:#fff}
.ac:disabled{opacity:.3}.att td.sun{background:color-mix(in srgb,var(--line) 40%,var(--panel))}.ac-h{font-size:11px;color:var(--mute);min-width:28px}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:12px 0 16px}.lcol{background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:10px;min-height:120px}
.lcol h3{margin:0 0 8px;font-family:'Big Shoulders Display','Arial Narrow',sans-serif;font-size:20px}.lead{display:block;width:100%;text-align:left;margin-bottom:8px;border-color:var(--line);background:var(--bg);cursor:grab}
.lead small{display:block;color:var(--mute);font-weight:400}.lead:hover{background:var(--bg);color:var(--ink);border-color:var(--paint)}
.dc{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1.5px solid var(--line);color:var(--mute);white-space:nowrap}
.dc.ok{color:var(--ok);border-color:var(--ok)}.dc.warn{color:var(--ink);border-color:var(--paint);background:color-mix(in srgb,var(--paint) 28%,transparent)}.dc.bad{color:var(--bad);border-color:var(--bad)}.dc.miss{color:var(--bad);border:1.5px dashed var(--bad)}
.flag{position:absolute;right:-10px;top:-10px;width:22px;height:22px;border-radius:50%;background:var(--bad);color:#fff;font:700 13px/22px sans-serif;text-align:center;font-style:normal}
.fzgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin:14px 0}
.fzc{border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg)}.fzc.wide{grid-column:1/-1}
.fzc h3{margin:0 0 4px;font-family:'Big Shoulders Display','Arial Narrow',sans-serif;font-size:22px;font-weight:800}
.sub{color:var(--mute);font-size:13px;min-height:1.3em}.fzc svg{display:block;width:100%}.fzc svg.cash{height:210px;margin:8px 0}
.rv{animation:rv 1.3s ease-out}@keyframes rv{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mute);margin-top:6px}.lg i{display:inline-block;width:16px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}
.wk{display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:6px}.wk>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}
.wk i{display:block;width:100%;background:var(--stock);border-radius:5px 5px 0 0}.wk .p i{background:transparent;border:2px dashed var(--paint);border-bottom:0}
.wk small{font-size:11px;color:var(--mute);text-align:center;line-height:1.1}.wk b{font-size:13px}
.mrow{display:grid;grid-template-columns:72px 1fr;gap:2px 8px;margin:10px 0}.mrow>span{grid-row:1/3;align-self:center;font-weight:600}
.mrow i{display:block;height:7px;border-radius:4px;margin:2px 0}.mrow i.a{background:var(--stock)}.mrow i.b{background:var(--line)}.mrow small{grid-column:2;color:var(--mute);font-size:12px}
@media (max-width:560px){.srch input{width:100%}header h1{font-size:34px}.clock{text-align:left}.kpi{border-right:0;border-bottom:1.5px solid var(--line)}}

/* ---- looks: the Theme menu in the header ---- */
html[data-skin="midnight"]:not(.x){--bg:#0B1324;--panel:#131E36;--ink:#EAF0FA;--mute:#93A4C2;--paint:#E8B84A;--line:#26385C;--stock:#3FB6C4;--sold:#7A8AA8;--rent:#F28C4B;--serv:#A58BE0;--ok:#4FD08A;--bad:#FF7A70;color-scheme:dark}
html[data-skin="midnight"] body{background:radial-gradient(1200px 600px at 8% -10%,#1B2C52,transparent 60%),#0B1324;background-attachment:fixed}
html[data-skin="midnight"] header{border-bottom:2px solid var(--paint)}html[data-skin="midnight"] header h1{color:var(--paint)}
html[data-skin="midnight"] .kpis,html[data-skin="midnight"] .fzc,html[data-skin="midnight"] .card,html[data-skin="midnight"] .lot,html[data-skin="midnight"] .lcol,html[data-skin="midnight"] .tl,html[data-skin="midnight"] .scroll,html[data-skin="midnight"] .drawer{border-radius:16px;border-color:#2A3E66;background:linear-gradient(180deg,#16243F,#111B31);box-shadow:0 10px 30px rgba(0,0,0,.35)}
html[data-skin="midnight"] .drawer{border-radius:0;border-left-color:var(--paint)}
html[data-skin="midnight"] table{background:transparent}html[data-skin="midnight"] .bay{border-radius:12px;border-color:rgba(232,184,74,.55)}
html[data-skin="midnight"] button.pri,html[data-skin="midnight"] nav button.on{background:var(--paint);border-color:var(--paint);color:#0B1324}
html[data-skin="midnight"] button.pri:hover{background:#fff;border-color:#fff}html[data-skin="midnight"] .kpi .num{color:var(--paint)}html[data-skin="midnight"] .mix{border-color:#2A3E66}
html[data-skin="white"]:not(.x){--bg:#F6F6F3;--panel:#FFFFFF;--ink:#111214;--mute:#6A6D72;--paint:#D7261E;--line:#E4E4E0;--stock:#111214;--sold:#9A9DA2;--rent:#D7261E;--serv:#5B4E9E;--ok:#1B7F3A;--bad:#C21F18;color-scheme:light}
html[data-skin="white"] h1,html[data-skin="white"] h2,html[data-skin="white"] h3,html[data-skin="white"] .num,html[data-skin="white"] .price{font-family:'Hanken Grotesk',system-ui,sans-serif;font-weight:800;letter-spacing:-.02em}
html[data-skin="white"] header{border-bottom:1px solid var(--line)}html[data-skin="white"] header h1{font-size:40px}
html[data-skin="white"] header h1:after{content:"";display:block;width:38px;height:4px;border-radius:2px;background:var(--paint);margin-top:8px}
html[data-skin="white"] .kpis,html[data-skin="white"] .fzc,html[data-skin="white"] .card,html[data-skin="white"] .lot,html[data-skin="white"] .lcol,html[data-skin="white"] .tl,html[data-skin="white"] .scroll,html[data-skin="white"] .drawer{border:0;border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 12px 30px rgba(0,0,0,.06)}
html[data-skin="white"] .drawer{border-radius:0}html[data-skin="white"] .kpi .num{font-size:36px}html[data-skin="white"] button{border-radius:999px}
html[data-skin="white"] button.pri,html[data-skin="white"] nav button.on{background:var(--ink);color:#fff;border-color:var(--ink)}html[data-skin="white"] button.pri:hover{background:var(--paint);border-color:var(--paint);color:#fff}
html[data-skin="white"] .bay{border:1.5px solid var(--line);border-top:3px solid var(--paint);border-radius:14px;background:#fff}html[data-skin="white"] .mix{border-color:var(--line);border-radius:999px}
html[data-skin="emerald"]:not(.x){--bg:#EAEFE4;--panel:#FBFAF4;--ink:#0F3B2F;--mute:#5A7167;--paint:#B8743A;--line:#C8D2BF;--stock:#0F6B54;--sold:#4D5E57;--rent:#C2622D;--serv:#6C5B9E;--ok:#1E7A4C;--bad:#B3342B;color-scheme:light}
html[data-skin="emerald"] body{background:linear-gradient(180deg,#F1F5EB,#E4EADB);background-attachment:fixed}
html[data-skin="emerald"] h1,html[data-skin="emerald"] h2,html[data-skin="emerald"] h3,html[data-skin="emerald"] .num,html[data-skin="emerald"] .price{font-family:'Playfair Display',Georgia,serif;font-weight:800}
html[data-skin="emerald"] header{border-bottom:4px double var(--ink)}
html[data-skin="emerald"] .kpis,html[data-skin="emerald"] .fzc,html[data-skin="emerald"] .card,html[data-skin="emerald"] .lot,html[data-skin="emerald"] .lcol,html[data-skin="emerald"] .tl,html[data-skin="emerald"] .scroll{border-radius:16px;border-color:#BFCBB5;box-shadow:0 6px 18px rgba(15,59,47,.08)}
html[data-skin="emerald"] button.pri,html[data-skin="emerald"] nav button.on{background:var(--ink);color:#F3EFE2;border-color:var(--ink)}html[data-skin="emerald"] button.pri:hover{background:var(--paint);border-color:var(--paint);color:#fff}
html[data-skin="emerald"] .bay{border:2px dashed var(--paint);border-radius:14px}html[data-skin="emerald"] .mix{border-color:var(--ink)}
html[data-skin="midnight"] [data-v="theme"],html[data-skin="white"] [data-v="theme"],html[data-skin="emerald"] [data-v="theme"]{display:none}
#skin{margin-top:6px;padding:3px 8px;font-size:13px;border-radius:6px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);max-width:100%}
html[dir=rtl] body,html[dir=rtl] button,html[dir=rtl] input,html[dir=rtl] select,html[dir=rtl] h1,html[dir=rtl] h2,html[dir=rtl] h3,html[dir=rtl] .num,html[dir=rtl] .price{font-family:'Noto Naskh Arabic','Hanken Grotesk',system-ui,sans-serif}
html[dir=rtl] *{letter-spacing:0!important}
html[dir=rtl] h1,html[dir=rtl] h2,html[dir=rtl] h3,html[dir=rtl] .num{font-weight:700;line-height:1.35}

 for(let i=N-1;i>=0;i--){const d=new Date(Date.now()-i*DAY),k=d.toDateString(),net=S.log.filter(l=>new Date(l.t).toDateString()===k).reduce((a,l)=>a+l.amt,0);cum+=net;days.push({d,net,cum})}
 const avg=days.reduce((a,x)=>a+x.net,0)/N,sd=Math.sqrt(days.reduce((a,x)=>a+(x.net-avg)**2,0)/N),last=days[N-1].cum;
 const pr=[...Array(H)].map((_,h)=>{const c=last+avg*(h+1),b=sd*Math.sqrt(h+1)*.6;return{c,lo:c-b,hi:c+b,d:new Date(Date.now()+(h+1)*DAY)}});
 const vals=[0,...days.map(x=>x.cum),...pr.flatMap(p=>[p.lo,p.hi])],mn=Math.min(...vals),mx=Math.max(...vals),Y=v=>B-(v-mn)/((mx-mn)||1)*(B-T),f=n=>n.toFixed(1);
 const hist=days.map((x,i)=>(i?'L':'M')+f(X(i))+' '+f(Y(x.cum))).join(' ');
 const fl='M'+f(X(N-1))+' '+f(Y(last))+pr.map((p,h)=>' L'+f(X(N+h))+' '+f(Y(p.c))).join('');
 const band='M'+f(X(N-1))+' '+f(Y(last))+pr.map((p,h)=>' L'+f(X(N+h))+' '+f(Y(p.hi))).join('')+[...pr].reverse().map((p,j)=>' L'+f(X(N+H-1-j))+' '+f(Y(p.lo))).join('')+' Z';
 const dt=d=>d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
 const hov=days.map((x,i)=>`<rect x='${f(X(i)-st/2)}' y='0' width='${f(st)}' height='200' fill='transparent' data-tip='${dt(x.d)}: net ${money(x.net)}. Running total ${money(x.cum)}'/>`).join('')+pr.map((p,h)=>`<rect x='${f(X(N+h)-st/2)}' y='0' width='${f(st)}' height='200' fill='transparent' data-tip='${dt(p.d)} (forecast): about ${money(p.c)}, likely ${money(p.lo)} to ${money(p.hi)}'/>`).join('');
 const b14=sd*Math.sqrt(H)*.6,fd=avg*H;
 return{sum:'Next 14 days at the current pace: '+(fd>=0?'+':'\u2212')+money(Math.abs(fd))+' net, likely between '+money(fd-b14)+' and '+money(fd+b14)+'.',

function fzWeeks(){const now=Date.now(),w=[0,1,2,3,4].map(i=>{const a=now-(5-i)*7*DAY,b=a+7*DAY;return S.cars.filter(c=>c.status==='sold'&&c.soldAt&&new Date(c.soldAt)>=a&&new Date(c.soldAt)<b).length});
 const nx=w.slice(2).reduce((a,b)=>a+b,0)/3,mx=Math.max(1,...w,nx),lb=['28\u201335d','21\u201328d','14\u201321d','7\u201314d','last 7d'];
